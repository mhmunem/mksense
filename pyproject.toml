[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "mksense"
version = "0.0.1"
description = "This project builds a customisation Retrieval-Augmented Generation (RAG) system for Python libraries like TensorFlow. Users can index documentation and codebases to enable natural language querying via LLMs.Easily extendable to any library, making technical exploration faster and more intuitive. This is a capstone project for llm-zoomcamp."
authors = [
  { name = "Mohammad Munem" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "==3.12.1"


[tool.ruff]
line-length = 99
src = ["mksense"]
include = ["pyproject.toml", "mksense/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["mksense"]
force-sort-within-sections = true

